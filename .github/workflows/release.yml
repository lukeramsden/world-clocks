name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure signing (optional)
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE" ]]; then
            echo 'No signing certificate configured; publishing an ad-hoc signed build.'
            exit 0
          fi
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${IDENTITY:?Missing Developer ID identity}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${TEAM_ID:?Missing team ID}"
          : "${APP_PASSWORD:?Missing app-specific password}"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials world-clocks-release --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo 'NOTARY_PROFILE=world-clocks-release' >> "$GITHUB_ENV"
      - name: Test and package universal app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release.sh
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            signing='Signed with Developer ID and notarized by Apple.'
          else
            signing='This build is ad-hoc signed, not notarized. If macOS blocks it, use System Settings > Privacy & Security > Open Anyway after attempting to launch it.'
          fi
          {
            echo 'Download the DMG, open it, and drag World Clocks into Applications.'
            echo
            echo 'Requires macOS 14 or later. The universal app runs on Apple Silicon and Intel Macs.'
            echo
            echo "$signing"
            echo
            echo 'A ZIP and SHA-256 checksums are also included.'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "World Clocks ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
